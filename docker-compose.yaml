services:
  # frontend:
  #   build: ./frontend
  #   container_name: frontend
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - app-net
  #   depends_on:
  #     - backend

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    networks:
      - app-net
      - db-net
    depends_on:
      - db
    volumes:
      - ./backend:/app
  db:
    image: postgres:17.11-alpine3.24
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - db-net
    volumes:
      - db-data:/var/lib/postgresql/data


networks:
  app-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  db-data: