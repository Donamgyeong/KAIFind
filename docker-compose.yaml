services:
    # frontend:
  #   build: ./frontend
  #   container_name: frontend
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - app-net
  #   depends_on:
  #     - backend
  
  backend:
    build: ./backend
    container_name: backend
    init: true
    working_dir: /app
    ports:
      - "8000:8000"
    networks:
      - app-net
      - db-net
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      EXPIRY_BATCH_SIZE: ${EXPIRY_BATCH_SIZE:-100}
      EXPIRY_MAX_ATTEMPTS: ${EXPIRY_MAX_ATTEMPTS:-3}
      EXPIRY_RETRY_SECONDS: ${EXPIRY_RETRY_SECONDS:-60,300}
      EXPIRY_LOCK_TIMEOUT_SECONDS: ${EXPIRY_LOCK_TIMEOUT_SECONDS:-10}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_TIME: ${BACKUP_TIME:-04:00}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Seoul}
      BACKUP_MINIO_BUCKET: ${BACKUP_MINIO_BUCKET:-kaifind-db-backups}
      BACKUP_MINIO_PREFIX: ${BACKUP_MINIO_PREFIX:-postgres/}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_POLL_SECONDS: ${BACKUP_POLL_SECONDS:-30}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-1800}
      BACKUP_MAX_ATTEMPTS: ${BACKUP_MAX_ATTEMPTS:-3}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-60,300}
      BACKUP_CATCH_UP_ENABLED: ${BACKUP_CATCH_UP_ENABLED:-true}
      APP_ENV: ${APP_ENV:-local}
      MOCK_AUTH_ENABLED: ${MOCK_AUTH_ENABLED:-false}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000}
      MINIO_ENDPOINT: storage:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      MINIO_BUCKET: ${MINIO_BUCKET:-kaifind-photos}
      MINIO_SECURE: "false"
      PHOTO_PUBLIC_BASE_URL: ${PHOTO_PUBLIC_BASE_URL:-http://localhost:8000}
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-10485760}
      PHOTO_MAX_PIXELS: ${PHOTO_MAX_PIXELS:-24000000}
      PHOTO_UNATTACHED_SECONDS: ${PHOTO_UNATTACHED_SECONDS:-86400}
      PHOTO_LINK_SECONDS: ${PHOTO_LINK_SECONDS:-60}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_DAILY_LIMIT: ${NOTIFICATION_EMAIL_DAILY_LIMIT:-20}
      NOTIFICATION_EMAIL_DIGEST_TIME: ${NOTIFICATION_EMAIL_DIGEST_TIME:-20:00}
      NOTIFICATION_EMAIL_POLL_SECONDS: ${NOTIFICATION_EMAIL_POLL_SECONDS:-5}
      NOTIFICATION_EMAIL_LEASE_SECONDS: ${NOTIFICATION_EMAIL_LEASE_SECONDS:-120}
      NOTIFICATION_EMAIL_TIMEOUT_SECONDS: ${NOTIFICATION_EMAIL_TIMEOUT_SECONDS:-30}
      NOTIFICATION_EMAIL_RETRY_SECONDS: ${NOTIFICATION_EMAIL_RETRY_SECONDS:-60,300,1800}
      NOTIFICATION_EMAIL_RETRY_JITTER_RATIO: ${NOTIFICATION_EMAIL_RETRY_JITTER_RATIO:-0.2}
      NOTIFICATION_EMAIL_MAX_ATTEMPTS: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:-10}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-mock}
      NOTIFICATION_EMAIL_APP_BASE_URL: ${NOTIFICATION_EMAIL_APP_BASE_URL:-https://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:17.11-alpine3.24
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    networks:
      - db-net
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: elestio/minio
    container_name: storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
    networks:
      - app-net
    command: server /data
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  app-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  db-data:
  storage-data:
